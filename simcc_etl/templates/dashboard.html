<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimCC ETL · Monitor de Execuções e Logs</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --card-hover: #1e293b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --primary: #38bdf8;
      --primary-dim: rgba(56, 189, 248, 0.15);
      --success: #34d399;
      --success-dim: rgba(52, 211, 153, 0.15);
      --warning: #fbbf24;
      --warning-dim: rgba(251, 191, 36, 0.15);
      --danger: #f87171;
      --danger-dim: rgba(248, 113, 113, 0.15);
      --term-bg: #030712;
      --term-border: #111827;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 20px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .live-dot.paused {
      background: var(--warning);
      box-shadow: none;
    }

    .btn {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #374151;
      border-color: #4b5563;
    }

    .btn-primary {
      background: #0284c7;
      border-color: #0369a1;
      color: #fff;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 380px;
      background: var(--card-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
    }

    .filter-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .runs-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .run-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .run-card:hover {
      background: var(--card-hover);
      border-color: #374151;
    }

    .run-card.active {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.07);
    }

    .run-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .run-card-id {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-running {
      background: var(--primary-dim);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-succeeded {
      background: var(--success-dim);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .badge-failed {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .badge-unknown {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(156, 163, 175, 0.3);
    }

    .run-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .run-card-routine {
      color: #93c5fd;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }

    /* Main Area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .run-header-panel {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .run-info-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .run-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .run-id-full {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .meta-pills {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .meta-item strong {
      color: var(--text);
    }

    /* Steps Flow */
    .steps-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .steps-container::-webkit-scrollbar {
      height: 4px;
    }
    .steps-container::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }

    .step-pill {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      padding: 4px 10px;
      border-radius: 6px;
      background: #1f2937;
      border: 1px solid #374151;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      color: var(--text-muted);
    }

    .step-pill.succeeded {
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.08);
      color: #6ee7b7;
    }

    .step-pill.running {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
    }

    .step-pill.failed {
      border-color: rgba(248, 113, 113, 0.4);
      background: rgba(248, 113, 113, 0.08);
      color: #fca5a5;
    }

    .error-alert {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fca5a5;
      font-size: 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-family: ui-monospace, monospace;
    }

    /* Log Toolbar */
    .log-toolbar {
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .log-filters {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .select-input {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 5px 8px;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    .checkbox-label {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Terminal Console */
    .terminal-container {
      flex: 1;
      background: var(--term-bg);
      overflow-y: auto;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .terminal-container::-webkit-scrollbar {
      width: 8px;
    }
    .terminal-container::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }

    .log-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 2px 0;
      word-break: break-all;
    }

    .log-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .log-time {
      color: var(--text-dim);
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-lvl {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-lvl-info { background: #075985; color: #bae6fd; }
    .log-lvl-warning { background: #854d0e; color: #fef08a; }
    .log-lvl-error { background: #991b1b; color: #fecaca; }

    .log-routine {
      color: #38bdf8;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-msg {
      color: #e5e7eb;
      flex: 1;
    }

    .log-extra {
      color: var(--text-muted);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.04);
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div>
        <div class="brand-title">SimCC ETL Monitor</div>
        <div class="brand-subtitle">Console de Execuções e Auditoria de Dados</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="live-status">
        <span id="liveDot" class="live-dot"></span>
        <span id="liveText">Ao vivo (3s)</span>
      </div>
      <button id="togglePollingBtn" class="btn" onclick="togglePolling()">Pausar</button>
      <button class="btn" onclick="refreshCurrentView()">↻ Atualizar</button>
      <a href="/docs" target="_blank" class="btn">Swagger Docs ↗</a>
    </div>
  </header>

  <!-- Layout Structure -->
  <div class="layout">
    <!-- Sidebar: Runs List / Daily Logs List -->
    <aside class="sidebar">
      <div class="tabs">
        <button id="tabRuns" class="tab-btn active" onclick="switchTab('runs')">
          Execuções (<span id="runsCount">0</span>)
        </button>
        <button id="tabDaily" class="tab-btn" onclick="switchTab('daily')">
          Logs Diários (<span id="dailyCount">0</span>)
        </button>
      </div>

      <div class="filter-box">
        <input type="text" id="sidebarSearch" class="search-input" placeholder="🔍 Filtrar ID, rotina ou data..." oninput="filterSidebarList()">
      </div>

      <div id="runsList" class="runs-list">
        <div class="empty-state">Carregando execuções...</div>
      </div>

      <div id="dailyList" class="runs-list" style="display: none;">
        <div class="empty-state">Carregando arquivos de log diários...</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-area">
      <!-- Run Details & Step Progress Bar -->
      <section id="runHeaderPanel" class="run-header-panel">
        <div class="run-info-top">
          <div class="run-title-group">
            <span id="runBadge" class="badge badge-unknown">CARREGANDO</span>
            <span id="runIdTitle" class="run-id-full">Selecione uma execução</span>
            <button class="btn" style="padding: 2px 8px; font-size: 11px;" onclick="copyRunId()">Copiar ID</button>
          </div>
          <div style="display: flex; gap: 8px;">
            <a id="downloadLogBtn" href="#" class="btn btn-primary" download>⤓ Baixar .jsonl</a>
          </div>
        </div>

        <div id="metaPills" class="meta-pills">
          <div class="meta-item">Início: <strong id="metaStarted">-</strong></div>
          <div class="meta-item">Fim: <strong id="metaEnded">-</strong></div>
          <div class="meta-item">Duração: <strong id="metaDuration">-</strong></div>
          <div class="meta-item">Disparado por: <strong id="metaTrigger">-</strong></div>
          <div class="meta-item" id="metaRoutineGroup" style="display: none;">
            Rotina atual: <strong id="metaCurrentRoutine" style="color: var(--primary);">-</strong>
          </div>
        </div>

        <div id="stepsContainer" class="steps-container"></div>
        <div id="errorAlert" class="error-alert" style="display: none;"></div>
      </section>

      <!-- Terminal Filter Toolbar -->
      <div class="log-toolbar">
        <div class="log-filters">
          <input type="text" id="logFilterSearch" class="search-input" placeholder="🔍 Filtrar texto nos logs..." oninput="renderFilteredLogs()" style="max-width: 250px;">
          <select id="logFilterLevel" class="select-input" onchange="renderFilteredLogs()">
            <option value="ALL">Todos os níveis</option>
            <option value="INFO">Apenas INFO</option>
            <option value="WARNING">Avisos (WARN)</option>
            <option value="ERROR">Erros (ERROR)</option>
          </select>
          <select id="logFilterRoutine" class="select-input" onchange="renderFilteredLogs()">
            <option value="ALL">Todas as rotinas</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; gap: 14px;">
          <label class="checkbox-label">
            <input type="checkbox" id="autoScrollCheck" checked> Fixar no fim
          </label>
          <span id="logCounter" style="font-size: 11px; color: var(--text-muted);">0 linhas</span>
        </div>
      </div>

      <!-- Terminal Log Output -->
      <div id="terminal" class="terminal-container">
        <div class="empty-state">Nenhum log carregado ainda.</div>
      </div>
    </main>
  </div>

  <script>
    // State
    let activeTab = 'runs';
    let allRuns = [];
    let allDailyFiles = [];
    let selectedRunId = null;
    let selectedDailyDate = null;
    let cachedLogLines = [];
    let logOffset = 0;
    let isPolling = true;
    let pollTimer = null;
    let pollIntervalMs = 3000;

    // Helpers
    function formatDate(isoStr) {
      if (!isoStr) return '-';
      try {
        const d = new Date(isoStr);
        return d.toLocaleString('pt-BR', { timeZone: 'America/Bahia' });
      } catch (e) {
        return isoStr;
      }
    }

    function formatDuration(started, ended) {
      if (!started) return '-';
      const s = new Date(started).getTime();
      const e = ended ? new Date(ended).getTime() : Date.now();
      const diffSec = Math.max(0, Math.floor((e - s) / 1000));
      const hours = Math.floor(diffSec / 3600);
      const mins = Math.floor((diffSec % 3600) / 60);
      const secs = diffSec % 60;
      if (hours > 0) return `${hours}h ${mins}m ${secs}s`;
      if (mins > 0) return `${mins}m ${secs}s`;
      return `${secs}s`;
    }

    function copyRunId() {
      if (selectedRunId) {
        navigator.clipboard.writeText(selectedRunId);
        alert('Run ID copiado: ' + selectedRunId);
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabRuns').classList.toggle('active', tab === 'runs');
      document.getElementById('tabDaily').classList.toggle('active', tab === 'daily');
      document.getElementById('runsList').style.display = tab === 'runs' ? 'flex' : 'none';
      document.getElementById('dailyList').style.display = tab === 'daily' ? 'flex' : 'none';

      if (tab === 'runs' && allRuns.length > 0 && !selectedRunId) {
        selectRun(allRuns[0].id);
      } else if (tab === 'daily' && allDailyFiles.length > 0 && !selectedDailyDate) {
        selectDaily(allDailyFiles[0].date);
      }
    }

    // Polling Control
    function togglePolling() {
      isPolling = !isPolling;
      document.getElementById('liveDot').classList.toggle('paused', !isPolling);
      document.getElementById('liveText').textContent = isPolling ? 'Ao vivo (3s)' : 'Pausado';
      document.getElementById('togglePollingBtn').textContent = isPolling ? 'Pausar' : 'Retomar';
    }

    function startPollingLoop() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        if (!isPolling) return;
        if (activeTab === 'runs') {
          await loadRuns(false);
          if (selectedRunId) {
            await fetchIncrementalLogs();
          }
        }
      }, pollIntervalMs);
    }

    // Load Runs
    async function loadRuns(initial = true) {
      try {
        const res = await fetch('/dashboard/api/runs?limit=50');
        if (!res.ok) throw new Error('Falha ao obter lista de runs');
        allRuns = await res.json();
        document.getElementById('runsCount').textContent = allRuns.length;
        renderRunsList();

        if (initial && allRuns.length > 0) {
          // Check URL param or hash
          const hashParam = window.location.hash.replace('#', '');
          const matched = allRuns.find(r => r.id === hashParam);
          selectRun(matched ? matched.id : allRuns[0].id);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderRunsList() {
      const filterText = document.getElementById('sidebarSearch').value.toLowerCase();
      const container = document.getElementById('runsList');
      const filtered = allRuns.filter(r => {
        return r.id.toLowerCase().includes(filterText) ||
          (r.current_routine && r.current_routine.toLowerCase().includes(filterText)) ||
          (r.routines && r.routines.some(x => x.toLowerCase().includes(filterText)));
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhuma execução encontrada.</div>';
        return;
      }

      container.innerHTML = filtered.map(r => {
        const isSelected = r.id === selectedRunId;
        const statusBadge = getStatusBadge(r.status);
        const routineInfo = r.status === 'RUNNING' && r.current_routine
          ? `⏳ ${r.current_routine}`
          : `${(r.routines || []).length} rotinas`;
        const dur = formatDuration(r.started_at, r.ended_at);

        return `
          <div class="run-card ${isSelected ? 'active' : ''}" onclick="selectRun('${r.id}')">
            <div class="run-card-header">
              <span class="run-card-id">${r.id.substring(0, 8)}...</span>
              ${statusBadge}
            </div>
            <div class="run-card-meta">
              <span class="run-card-routine">${routineInfo}</span>
              <span>${dur}</span>
            </div>
            <div class="run-card-meta" style="color: var(--text-dim); font-size: 10px;">
              <span>${formatDate(r.started_at)}</span>
              <span>${r.triggered_by || 'system'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function getStatusBadge(status) {
      if (status === 'RUNNING') return '<span class="badge badge-running pulse">● Rodando</span>';
      if (status === 'SUCCEEDED') return '<span class="badge badge-succeeded">✓ Sucesso</span>';
      if (status === 'FAILED') return '<span class="badge badge-failed">✕ Falhou</span>';
      return `<span class="badge badge-unknown">${status || 'DESCONHECIDO'}</span>`;
    }

    // Select Run
    async function selectRun(runId) {
      selectedRunId = runId;
      window.location.hash = runId;
      renderRunsList();

      const run = allRuns.find(r => r.id === runId);
      if (run) {
        updateRunHeader(run);
      }

      // Reset logs cache
      cachedLogLines = [];
      logOffset = 0;
      document.getElementById('terminal').innerHTML = '<div class="empty-state">Carregando logs da execução...</div>';
      await fetchIncrementalLogs();
    }

    function updateRunHeader(run) {
      document.getElementById('runIdTitle').textContent = run.id;
      document.getElementById('runBadge').outerHTML = `<span id="runBadge">${getStatusBadge(run.status)}</span>`;
      document.getElementById('metaStarted').textContent = formatDate(run.started_at);
      document.getElementById('metaEnded').textContent = formatDate(run.ended_at);
      document.getElementById('metaDuration').textContent = formatDuration(run.started_at, run.ended_at);
      document.getElementById('metaTrigger').textContent = run.triggered_by || 'system';

      const routineGroup = document.getElementById('metaRoutineGroup');
      if (run.status === 'RUNNING' && run.current_routine) {
        routineGroup.style.display = 'block';
        document.getElementById('metaCurrentRoutine').textContent = run.current_routine;
      } else {
        routineGroup.style.display = 'none';
      }

      // Download Button
      const downloadBtn = document.getElementById('downloadLogBtn');
      downloadBtn.href = `/dashboard/api/runs/${run.id}/download`;
      downloadBtn.style.display = 'inline-flex';

      // Steps Render
      const stepsContainer = document.getElementById('stepsContainer');
      const routines = run.routines || [];
      const steps = run.steps || {};

      stepsContainer.innerHTML = routines.map((name, idx) => {
        const step = steps[name];
        let cls = '';
        let icon = `${idx + 1}.`;
        let meta = '';

        if (step) {
          if (step.status === 'SUCCEEDED') {
            cls = 'succeeded';
            icon = '✓';
            if (step.duration_ms) {
              const s = Math.round(step.duration_ms / 1000);
              meta = `(${s}s)`;
            }
          } else if (step.status === 'FAILED') {
            cls = 'failed';
            icon = '✕';
          }
        } else if (run.status === 'RUNNING' && run.current_routine === name) {
          cls = 'running pulse';
          icon = '⏳';
        }

        return `<div class="step-pill ${cls}"><span>${icon}</span> <strong>${name}</strong> <span>${meta}</span></div>`;
      }).join('');

      // Error Alert
      const errBox = document.getElementById('errorAlert');
      if (run.error_message) {
        errBox.style.display = 'flex';
        errBox.innerHTML = `<strong>Falha na Execução:</strong> ${escapeHtml(run.error_message)}`;
      } else {
        errBox.style.display = 'none';
      }
    }

    // Fetch Logs Incrementally
    async function fetchIncrementalLogs() {
      if (!selectedRunId) return;

      try {
        const res = await fetch(`/dashboard/api/runs/${selectedRunId}/logs?offset=${logOffset}&limit=1000`);
        if (!res.ok) return;
        const data = await res.json();

        if (data.lines && data.lines.length > 0) {
          cachedLogLines.push(...data.lines);
          logOffset = data.next_offset;
          populateRoutineFilter();
          renderFilteredLogs();
        }

        if (data.status && allRuns.length > 0) {
          const run = allRuns.find(r => r.id === selectedRunId);
          if (run && run.status !== data.status) {
            run.status = data.status;
            updateRunHeader(run);
            renderRunsList();
          }
        }
      } catch (err) {
        console.error('Erro ao buscar logs:', err);
      }
    }

    function populateRoutineFilter() {
      const select = document.getElementById('logFilterRoutine');
      const currentVal = select.value;
      const routines = new Set();

      cachedLogLines.forEach(l => {
        if (l.routine) routines.add(l.routine);
      });

      const options = ['<option value="ALL">Todas as rotinas</option>'];
      Array.from(routines).sort().forEach(r => {
        options.push(`<option value="${r}">${r}</option>`);
      });

      select.innerHTML = options.join('');
      if (routines.has(currentVal)) {
        select.value = currentVal;
      }
    }

    function renderFilteredLogs() {
      const search = document.getElementById('logFilterSearch').value.toLowerCase();
      const level = document.getElementById('logFilterLevel').value;
      const routine = document.getElementById('logFilterRoutine').value;
      const autoScroll = document.getElementById('autoScrollCheck').checked;
      const terminal = document.getElementById('terminal');

      const filtered = cachedLogLines.filter(line => {
        if (level !== 'ALL') {
          const lvl = (line.level || 'info').toUpperCase();
          if (level === 'ERROR' && lvl !== 'ERROR') return false;
          if (level === 'WARNING' && !['WARNING', 'WARN'].includes(lvl)) return false;
          if (level === 'INFO' && lvl !== 'INFO') return false;
        }

        if (routine !== 'ALL' && line.routine !== routine) {
          return false;
        }

        if (search) {
          const lineStr = JSON.stringify(line).toLowerCase();
          if (!lineStr.includes(search)) return false;
        }

        return true;
      });

      document.getElementById('logCounter').textContent = `${filtered.length} de ${cachedLogLines.length} linhas`;

      if (filtered.length === 0) {
        terminal.innerHTML = '<div class="empty-state">Nenhum evento corresponde aos filtros.</div>';
        return;
      }

      terminal.innerHTML = filtered.map(l => {
        const timeStr = l.timestamp ? l.timestamp.substring(11, 19) : '--:--:--';
        const lvl = (l.level || 'info').toLowerCase();
        let lvlClass = 'log-lvl-info';
        if (lvl === 'warn' || lvl === 'warning') lvlClass = 'log-lvl-warning';
        if (lvl === 'error' || lvl === 'fatal') lvlClass = 'log-lvl-error';

        const routineTag = l.routine ? `<span class="log-routine">[${escapeHtml(l.routine)}]</span>` : '';
        const msgText = l.message || l.event || '';

        let extras = '';
        if (l.found !== undefined || l.succeeded !== undefined || l.failed !== undefined) {
          extras = `<span class="log-extra">found: ${l.found ?? 0} | ok: ${l.succeeded ?? 0} | err: ${l.failed ?? 0}</span>`;
        } else if (l.duration_ms !== undefined) {
          extras = `<span class="log-extra">${l.duration_ms}ms</span>`;
        }

        return `
          <div class="log-row">
            <span class="log-time">${timeStr}</span>
            <span class="log-lvl ${lvlClass}">${lvl}</span>
            ${routineTag}
            <span class="log-msg">${escapeHtml(msgText)}</span>
            ${extras}
          </div>
        `;
      }).join('');

      if (autoScroll) {
        terminal.scrollTop = terminal.scrollHeight;
      }
    }

    // Daily Logs Support
    async function loadDailyFiles() {
      try {
        const res = await fetch('/dashboard/api/daily');
        if (!res.ok) return;
        allDailyFiles = await res.json();
        document.getElementById('dailyCount').textContent = allDailyFiles.length;
        renderDailyList();
      } catch (e) {
        console.error(e);
      }
    }

    function renderDailyList() {
      const container = document.getElementById('dailyList');
      if (allDailyFiles.length === 0) {
        container.innerHTML = '<div class="empty-state">Nenhum log diário encontrado.</div>';
        return;
      }

      container.innerHTML = allDailyFiles.map(d => {
        const isSelected = d.date === selectedDailyDate;
        const sizeKb = Math.round(d.size_bytes / 1024);
        return `
          <div class="run-card ${isSelected ? 'active' : ''}" onclick="selectDaily('${d.date}')">
            <div class="run-card-header">
              <span class="run-card-id">📅 ${d.date}</span>
              <span class="badge badge-unknown">${sizeKb} KB</span>
            </div>
            <div class="run-card-meta">
              <span>${d.filename}</span>
              <span>${formatDate(d.modified_at)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function selectDaily(dateStr) {
      selectedDailyDate = dateStr;
      renderDailyList();

      document.getElementById('runIdTitle').textContent = `Log Diário: ${dateStr}.jsonl`;
      document.getElementById('runBadge').outerHTML = '<span id="runBadge" class="badge badge-unknown">DIÁRIO</span>';
      document.getElementById('stepsContainer').innerHTML = '';
      document.getElementById('errorAlert').style.display = 'none';

      const downloadBtn = document.getElementById('downloadLogBtn');
      downloadBtn.href = `/dashboard/api/daily/${dateStr}/download`;
      downloadBtn.style.display = 'inline-flex';

      cachedLogLines = [];
      logOffset = 0;
      document.getElementById('terminal').innerHTML = '<div class="empty-state">Carregando log diário...</div>';

      try {
        const res = await fetch(`/dashboard/api/daily/${dateStr}/logs?offset=0&limit=2000`);
        if (!res.ok) return;
        const data = await res.json();
        cachedLogLines = data.lines || [];
        populateRoutineFilter();
        renderFilteredLogs();
      } catch (err) {
        console.error(err);
      }
    }

    function filterSidebarList() {
      if (activeTab === 'runs') {
        renderRunsList();
      } else {
        renderDailyList();
      }
    }

    function refreshCurrentView() {
      loadRuns(false);
      loadDailyFiles();
      if (activeTab === 'runs' && selectedRunId) {
        cachedLogLines = [];
        logOffset = 0;
        fetchIncrementalLogs();
      } else if (activeTab === 'daily' && selectedDailyDate) {
        selectDaily(selectedDailyDate);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      loadRuns(true);
      loadDailyFiles();
      startPollingLoop();
    });
  </script>
</body>
</html>
