services:
  # Serviço principal da API do SimCC ETL
  etl:
    build: .
    image: simcc-etl:latest
    container_name: simcc_etl
    env_file: .env
    environment:
      STORAGE_DIR: /app/storage
      HOP_SERVER_URL: ${HOP_SERVER_URL:-http://hop:8080}
    volumes:
      - ${STORAGE_PATH:-./storage}:/app/storage
    ports:
      - "127.0.0.1:${ETL_PORT:-8001}:8000"
    networks:
      - simcc-network
    restart: unless-stopped

networks:
  simcc-network:
    external: true
