services:
  write_db:
    image: pgvector/pgvector:pg17
    container_name: simcc_write_db
    environment:
      POSTGRES_USER: ${WRITE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${WRITE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${WRITE_DB_NAME:-simcc_write}
    ports:
      - "${WRITE_DB_PORT:-5435}:5432"
    networks:
      - simcc-network
    volumes:
      - write_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WRITE_DB_USER:-postgres} -d ${WRITE_DB_NAME:-simcc_write}"]
      interval: 5s
      timeout: 5s
      retries: 5

  read_db:
    image: pgvector/pgvector:pg17
    container_name: simcc_read_db
    environment:
      POSTGRES_USER: ${READ_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${READ_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${READ_DB_NAME:-simcc}
    ports:
      - "${READ_DB_PORT:-5434}:5432"
    networks:
      - simcc-network
    volumes:
      - read_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${READ_DB_USER:-postgres} -d ${READ_DB_NAME:-simcc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: simcc_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - simcc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API do ETL em container (opcional; suba com `docker compose up -d etl`).
  # A rotina hop_index cria containers do Apache Hop pelo socket Docker do
  # host. Como o bind mount dos XMLs é resolvido pelo daemon do HOST, o
  # storage é montado no MESMO caminho absoluto do host e STORAGE_DIR /
  # HOST_STORAGE_DIR apontam para ele (ver README, seção Configuração).
  etl:
    build: .
    image: simcc-etl:latest
    container_name: simcc_etl
    env_file: .env
    environment:
      STORAGE_DIR: ${HOST_STORAGE_DIR:-/opt/simcc/storage}
      HOST_STORAGE_DIR: ${HOST_STORAGE_DIR:-/opt/simcc/storage}
    # Sem `:?` de propósito: a interpolação vale para o arquivo inteiro e
    # quebraria `docker compose up write_db` sem essas variáveis.
    # GID do grupo docker do host: `getent group docker | cut -d: -f3`
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_STORAGE_DIR:-/opt/simcc/storage}:${HOST_STORAGE_DIR:-/opt/simcc/storage}
    ports:
      - "127.0.0.1:${ETL_PORT:-8001}:8000"
    networks:
      - simcc-network
    profiles:
      - etl
    restart: unless-stopped

networks:
  simcc-network:
    external: true

volumes:
  write_db_data:
  read_db_data:
